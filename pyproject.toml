[project]
name = "ventas-streaming"
version = "0.1.0"
description = "Pipeline end-to-end de ventas de retail en streaming con Kafka y Apache Beam"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "apache-beam==2.74.0",
  "kafka-python-ng==2.2.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/transforms.py" = ["B008"]
"tests/*.py" = ["B008"]
