services:

  kafka:
    image: apache/kafka:3.9.0
    container_name: ventas-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Crea los topicos una vez que el broker esta sano y termina.
  init-topics:
    image: apache/kafka:3.9.0
    container_name: ventas-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        K=/opt/kafka/bin/kafka-topics.sh
        $$K --create --if-not-exists --bootstrap-server kafka:19092 \
          --topic ventas.raw --partitions 6 --replication-factor 1 \
          --config retention.ms=604800000
        $$K --create --if-not-exists --bootstrap-server kafka:19092 \
          --topic ventas.totales --partitions 6 --replication-factor 1 \
          --config cleanup.policy=compact --config retention.ms=604800000
        $$K --create --if-not-exists --bootstrap-server kafka:19092 \
          --topic ventas.invalidos --partitions 3 --replication-factor 1 \
          --config retention.ms=1209600000
        echo "Topicos creados:"
        $$K --list --bootstrap-server kafka:19092

volumes:
  kafka-data:
